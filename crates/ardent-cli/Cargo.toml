[package]
name = "ardent-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ardent"
path = "src/main.rs"

[dependencies]
ardent-core.workspace = true
ardent-format.workspace = true
clap = { version = "4.6.9", features = ["derive"] }
console = { version = "0.16.6", default-features = false, features = ["std"] }
ignore = "0.4.34"
same-file = "1.0.6"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["termios"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
rustix = { version = "1.1.6", features = ["pty", "termios"] }
