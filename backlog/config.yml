project_name: "Ardent"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
definition_of_done: ["Verification gate passes: cargo fmt --check / cargo clippy --all-targets -- -D warnings / cargo test", "Changed Markdown is formatted with rumdl", "README and specs match the new behavior", "OpenSpec change archived in the same PR when the task has one"]
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
