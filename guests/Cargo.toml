[workspace]
resolver = "3"
members = ["engine", "markdown", "rust", "test-scanner"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
ardent-core = { path = "../crates/ardent-core" }
ardent-format-guest = { path = "engine" }
tree-sitter-md = "=0.5.4"
tree-sitter-rust = "=0.24.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"

[profile.release]
strip = "debuginfo"
