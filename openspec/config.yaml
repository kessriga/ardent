schema: spec-driven

context: |
  Ardent is a Rust TUI outliner. It derives a tree of nodes from structured source files and attaches views to nodes.
  Use the glossary in README.md exactly: node, outline, node path, fingerprint, structure, sync, view, view entry, anchor, reference, backlink, format plugin, view plugin.
  Source files belong to the user. Ardent writes only inside the project's .ardent/ directory unless a spec says otherwise.
  Files in .ardent/ are YAML that a person can read and diff.
  Core design questions (anchors, sync, .ardent/ layout, plugins) are settled by Backlog decisions from milestone M0.
  Cite the decision a design depends on; if none exists, list the question under open questions instead of deciding it.
  Each change is named task-<n>-<slug> after the Backlog task it implements.

rules:
  proposal:
    - Name the Backlog task the change implements.
    - State what is out of scope.
  design:
    - Name the crate each new type or module lives in, and keep ardent-core free of terminal and plugin-runtime code.
  specs:
    - Write scenarios against observable behavior, such as CLI output, TUI state, or files in .ardent/.
  tasks:
    - Each task ends with a passing cargo fmt --check, cargo clippy --all-targets -- -D warnings, and cargo test.
